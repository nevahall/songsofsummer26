<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}"><span class="brand__mark">♫</span><span>Songs of the Summer</span></a>
      <nav aria-label="Main navigation"><a href="{{ '/' | relative_url }}">Countdown</a></nav>
    </header>
    <main>{{ content }}</main>
    <footer class="site-footer"><span>© {{ 'now' | date: '%Y' }} Songs of the Summer</span><span>Made for the soundtrack of the season.</span></footer>
  </body>
</html>
